[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-tracer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "duckdb>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "ib_async>=2.0,<3.0",
    "yfinance>=0.2.55,<2.0",
    "wrds>=3.3,<4.0",
]

# This is the only reason this file exists: it maps the import name
# `data_pulling` onto data/data_pulling/, so `pip install -e .` makes
# `from data_pulling import get_prices` work from programs/ROME/ and anywhere
# else. Note this registers the package in the VENV ONLY -- programs/ROME/
# rome.py also appends data/ to sys.path so it works under any interpreter.
#
# hatchling, not setuptools: setuptools writes a project_tracer.egg-info/
# folder into the repo on every install. hatchling builds in a temp dir and
# leaves nothing behind.
[tool.hatch.build.targets.wheel]
packages = ["data/data_pulling"]
