[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-tracer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "duckdb>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "ib_async>=2.0,<3.0",
    "yfinance>=0.2.55,<2.0",
    "wrds>=3.3,<4.0",
    "statsmodels>=0.14,<1.0",
]

# This is the only reason this file exists: it maps the import name
# `data_pulling` onto data/data_pulling/, so `pip install -e .` makes
# `from data_pulling import get_prices` work from any directory. Note this
# registers the packages in the VENV ONLY, so scripts under
# data/one_time_scripts/ also append to sys.path to run under any interpreter.
#
# hatchling, not setuptools: setuptools writes a project_tracer.egg-info/
# folder into the repo on every install. hatchling builds in a temp dir and
# leaves nothing behind.
# utils.py is a single file at the repo root. data_pulling imports
# `from utils import load_config`, so it has to be importable wherever data_pulling is:
# force-include puts it in the wheel, and dev-mode-dirs keeps the repo root on the
# path for the editable install.
#
# programs/ROME imports as `ROME`, so runner.py can do
# `from ROME.strategy.formation import form_pairs` from any directory.
[tool.hatch.build.targets.wheel]
packages = ["data/data_pulling", "programs/ROME"]
dev-mode-dirs = [".", "data", "programs"]

[tool.hatch.build.targets.wheel.force-include]
"utils.py" = "utils.py"
