# Project Tracer config. No secrets here.
# WRDS password lives in pgpass:
#   Windows  %APPDATA%\postgresql\pgpass.conf
#   Linux    ~/.pgpass  (chmod 600)
#   Format   wrds-pgdata.wharton.upenn.edu:9737:wrds:<user>:<password>

paths:
  universes: data/store/universes
  db: data/store

data:
  providers:
    ibkr:
      host: 127.0.0.1
      port: 7497          # TWS paper. live 7496 | Gateway paper 4002 | live 4001
      client_id: 11
      timeout: 30
      pace_seconds: 2.5

    wrds:
      username: null      # null -> read it from pgpass
      daily_table: crsp.dsf_v2
      info_table: crsp.stksecurityinfohist

    yfinance:
      auto_adjust: true

    columns = ("date", "open", "high", "low", "close", "adj_close", "volume") 
    provider_order = ("ibkr", "wrds", "yfinance")

coverage_slack_days: 5 # How many calendar days short of the requested end a series may stop before it counts as a failure (covers weekends and holidays).

logging:
  level: INFO

strategies:
  ROME:
    status: dev
    description: ETF pairs trading across commodity, rates, credit and FX proxies.
