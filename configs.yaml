# Project Tracer config. No secrets here.
# WRDS password lives in pgpass:
#   Windows  %APPDATA%\postgresql\pgpass.conf
#   Linux    ~/.pgpass  (chmod 600)
#   Format   wrds-pgdata.wharton.upenn.edu:9737:wrds:<user>:<password>
#

data:
  # Canonical frame columns every provider returns, in order.
  columns: [date, open, high, low, close, adj_close, volume]
  start: 2010-01-01
  end: null
  default_provider: wrds
  provider_order: [ibkr, wrds, yfinance]

  DB_path: data/store
  constituents: data/store/universes
  trade_log: data/store/trade_log

  providers:
    ibkr:
      host: 127.0.0.1
      port: 7497          # TWS paper. live 7496 | Gateway paper 4002 | live 4001
      client_id: 11
      timeout: 30
      pace_seconds: 2.5   # TWS allows 60 historical requests per 10 min

    wrds:
      username: null      # null -> read it from pgpass
      daily_table: crsp.dsf_v2
      info_table: crsp.stksecurityinfohist

    yfinance:
      auto_adjust: false

# How many calendar days short of the requested end a series may stop before it
# counts as a failure (covers weekends and holidays).
coverage_slack_days: 5

logging:
  level: INFO


strategies:
  ROME:
    status: dev
    description: ETF pairs trading across commodity, rates, credit and FX proxies.
    db: data/store/ROME.duckdb 

    # Every null below is a TBD and MUST be pinned before the holdout is
    # touched. Log every variant run with its config hash + variant ID.

    # --- formation: which pairs are tradable. Refit monthly. ---------------
    formation:
      pairs_file: data/store/universes/ROME_pairs.csv
      lookback_months: 12      # window for beta, alpha, half-life, sigma (data <= t only)
      test_window_months: 12   # window for the cointegration test; can go longer than lookback later
      refit: monthly
      top_n: 5
      halflife_min: 1          # trading days
      halflife_max: 30         # trading days
      cost_hurdle_mult: 3.0    # entry_z x sigma must beat this many round-trip costs (not active until costs.py)
      coint_pvalue: 0.05
      coint_trend: ct          # Engle-Granger constant + trend
      coint_autolag: aic       # how the Engle-Granger test picks its lag count: aic | bic | t-stat
      coint_direction: a_on_b  # symbol_a is the dependent leg, as ordered in pairs_file
      allow_negative_beta: false  # beta <= 0 = long both / short both = directional, not a hedge
      min_coverage: 0.95       # share of the window's trading days each leg must have
      rank_by: half_life       # half_life | pvalue — which tradable pairs make top_n
      multiple_testing: none   # deferred; ~4 of 72 pairs can pass by chance each refit

    # --- signal -----------------------------------------------------------
    signal:
      entry_z: 2.0
      exit_z: 0.0
      stop_z: 3.5
      time_stop_mult: 3.0      # multiple of the pair's half-life
      zscore_lookback: null    # TBD — pre-register before the holdout

    # --- hedge ratio ------------------------------------------------------
    hedge:
      method: ols              # ols | kalman
      kalman_delta: null       # TBD
      kalman_obs_var: null     # TBD

    # --- cointegration breakdown while a trade is open --------------------
    breakdown:
      action: force_close      # force_close | hold — toggle to compare
      window: 126
      pvalue: 0.10
      consecutive_fails: 3     # k checks in a row before acting

    # --- sizing -----------------------------------------------------------
    sizing:
      capital: 10000           # C$
      risk_per_pair: 0.01      # fraction of capital, from SPREAD vol
      min_notional_per_leg: 1000
      # max_pairs is derived, not set: capital // (2 * min_notional_per_leg)

    # --- costs (read by strategy/costs.py) ---------------------------------
    # ESTIMATES, NOT VERIFIED: check against your IBKR account's actual pricing plan.
    costs:
      commission_per_share: 0.005  # USD per share, each order (IBKR "Fixed" plan for US stocks/ETFs)
      min_commission: 1.00         # USD minimum per order
      max_commission_pct: 0.01     # commission capped at 1% of the trade's value
      half_spread_bps: 2.0         # half the bid-ask spread, per fill. Liquid ETFs ~0.5-2; thin ones (FXF, FXB) wider
      borrow_fee_annual: 0.005     # short-leg borrow, 0.5% a year (easy-to-borrow ETFs)
      fx_bps: 0.0                  # 0 = USD is held in the account; set > 0 if every trade converts CAD<->USD

    # --- execution --------------------------------------------------------
    execution:
      fill: next_open

    # --- walk-forward splits; holdout runs ONCE ---------------------------
    splits:
      train: [2012-01-01, 2019-12-31]
      validate: [2020-01-01, 2022-12-31]
      holdout: [2023-01-01, 2026-09-29]

# Run controls. Kept OUTSIDE strategies.ROME so they don't change the variant hash
# (a backtest and a paper run of the same variant must share one ID).
run:
  mode: backtest               # backtest | paper | live
  split: train                 # train | validate | holdout (one per run)
  holdout_unlocked: false      # must be true AND no prior holdout run in the trade log

# Research scripts (programs/ROME/research/). Outside strategies.ROME so they don't change the hash.
research:
  output_dir: programs/ROME/research/output
  scan_split: train            # formation_scan runs on this split only (research on train, never holdout)
